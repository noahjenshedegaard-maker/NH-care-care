<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NH Car Care — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0F2A47;--blue:#1565C0;--blue-dark:#0D4F9E;--sky:#E3F2FD;--line:#D6E4F0;--text:#0F2A47;--muted:#4A5B6E;--bg:#F5F8FB;--white:#fff;
  --pending-bg:#FFF4E0;--pending:#8A4B00;--done-bg:#E6F4EC;--done:#1B6B40;--cancel-bg:#EEF0F3;--cancel:#4A5563;--error:#B3261E}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2{font-family:Archivo,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}

.top{background:var(--navy);color:var(--white);padding:14px 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.brand b{font-family:Archivo,sans-serif;font-weight:900;letter-spacing:.05em}
.brand small{display:block;font-size:11px;letter-spacing:.14em;color:#BBDEFB;font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-light{background:rgba(255,255,255,.12);color:var(--white)}
.btn-light:hover{background:rgba(255,255,255,.2)}
.btn-primary{background:var(--blue);color:var(--white);width:100%;font-size:16px;min-height:50px;justify-content:center}
.btn-primary:hover{background:var(--blue-dark)}

/* Login */
.login{max-width:380px;margin:60px auto;background:var(--white);border:2px solid var(--line);border-radius:18px;padding:28px}
.login h1{font-size:24px;margin-bottom:4px}
.login p{color:var(--muted);margin:0 0 20px;font-size:14px}
.login label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.login input{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px}
.login input:focus{outline:none;border-color:var(--blue)}
.login .btn-primary{margin-top:20px}
.err{color:var(--error);font-weight:600;font-size:14px;margin-top:12px;min-height:20px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0 16px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--white);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.stat span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.stat b{font-family:Archivo,sans-serif;font-size:26px;font-weight:900}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--white);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:700;font-size:14px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--white)}
.search{border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;font-size:15px;flex:1 1 200px;max-width:320px;background:var(--white)}
.search:focus{outline:none;border-color:var(--blue)}

/* Booking cards */
.list{display:flex;flex-direction:column;gap:12px;padding-bottom:40px}
.card{background:var(--white);border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
.card.is-done{opacity:.8}
.c-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.c-name{font-family:Archivo,sans-serif;font-weight:800;font-size:19px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.04em}
.badge.pending{background:var(--pending-bg);color:var(--pending)}
.badge.done{background:var(--done-bg);color:var(--done)}
.badge.cancelled{background:var(--cancel-bg);color:var(--cancel)}
.c-when{font-weight:700;color:var(--blue-dark)}
.c-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted);margin-top:6px}
.c-meta b{color:var(--text);font-weight:600}
.c-contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.c-contact a{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;text-decoration:none;border-radius:10px;padding:8px 12px;min-height:40px;background:var(--sky);color:var(--blue-dark)}
.c-contact a:hover{background:#D0E7FB}
.looking{grid-column:1 / -1;background:#F0F7FF;border-radius:12px;padding:10px 14px;font-size:14px}
.looking b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-dark);margin-bottom:2px}
.looking p{margin:0;white-space:pre-wrap;word-break:break-word}
.c-side{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:170px}
.c-side label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.c-side select,.c-side input{border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;background:var(--white);font-weight:600;width:100%}
.c-side select:focus,.c-side input:focus{outline:none;border-color:var(--blue)}
.price-row{display:flex;align-items:center;gap:6px}
.price-row span{font-weight:700}
.notes{grid-column:1 / -1}
.notes textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;min-height:44px;resize:vertical}
.notes textarea:focus{outline:none;border-color:var(--blue)}
.saved{font-size:12px;font-weight:700;color:var(--done);height:16px}
@media (max-width:640px){.card{grid-template-columns:1fr}.c-side{min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}.c-side .saved{grid-column:1 / -1}}
.empty{text-align:center;color:var(--muted);padding:50px 10px;background:var(--white);border:2px dashed var(--line);border-radius:16px}
.hidden{display:none !important}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7c-3.3 4-6 7.4-6 10.8a6 6 0 0 0 12 0c0-3.4-2.7-6.8-6-10.8z"/></svg></div>
      <div><b>NH CAR CARE</b><small>ADMIN</small></div>
    </div>
    <a class="btn btn-light" href="index.html" id="back-site">← Website</a>
    <div class="top-actions hidden" id="top-actions">
      <button class="btn btn-light" id="refresh" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>Refresh</button>
      <button class="btn btn-light" id="logout" type="button">Log out</button>
    </div>
  </div>
</header>

<main class="wrap">
  <form class="login hidden" id="login">
    <h1>Admin login</h1>
    <p>Enter your password to see and manage bookings.</p>
    <input type="text" id="email" autocomplete="username" value="admin" hidden aria-hidden="true" tabindex="-1">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit" id="login-btn">Log in</button>
    <div class="err" id="login-err" role="alert"></div>
  </form>

  <div id="dash" class="hidden">
    <div class="stats">
      <div class="stat"><span>Pending</span><b id="s-pending">0</b></div>
      <div class="stat"><span>Today</span><b id="s-today">0</b></div>
      <div class="stat"><span>Done</span><b id="s-done">0</b></div>
      <div class="stat"><span>Earned (done)</span><b id="s-earned">AED 0</b></div>
    </div>
    <div class="toolbar">
      <div class="tabs" role="group" aria-label="Filter bookings">
        <button class="tab" type="button" data-filter="pending" aria-pressed="true">Pending</button>
        <button class="tab" type="button" data-filter="done" aria-pressed="false">Done</button>
        <button class="tab" type="button" data-filter="cancelled" aria-pressed="false">Cancelled</button>
        <button class="tab" type="button" data-filter="all" aria-pressed="false">All</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Search name, phone, area…" aria-label="Search bookings">
    </div>
    <div class="list" id="list"></div>
  </div>
</main>

<script>
(function () {
  var cfg = window.NH_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var configured = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf('YOUR-') === -1 && cfg.SUPABASE_ANON_KEY && cfg.SUPABASE_ANON_KEY.indexOf('YOUR-') === -1;
  var client = configured && window.supabase ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;

  var bookings = [];
  var filter = 'pending';
  var SERVICES = { exterior: 'Exterior Wash', interior: 'Interior Clean', full: 'Full Wash' };
  var TIMES = { morning: 'Morning 8–12', afternoon: 'Afternoon 12–4', evening: 'Evening 4–8' };
  var today = new Date(Date.now() + 4 * 3600 * 1000).toISOString().slice(0, 10);

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function fmtDate(d) {
    if (!d) return '';
    if (d === today) return 'Today';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function waNumber(phone) {
    var digits = (phone || '').replace(/\D/g, '');
    if (digits.indexOf('00') === 0) digits = digits.slice(2);
    else if (digits.indexOf('0') === 0) digits = '971' + digits.slice(1);
    return digits;
  }

  function showLogin(msg) {
    $('login').classList.remove('hidden');
    $('dash').classList.add('hidden');
    $('top-actions').classList.add('hidden');
    $('login-err').textContent = msg || '';
  }
  function showDash() {
    $('login').classList.add('hidden');
    $('dash').classList.remove('hidden');
    $('top-actions').classList.remove('hidden');
  }

  async function load() {
    var res = await client.from('bookings').select('*')
      .order('preferred_date', { ascending: true }).order('created_at', { ascending: true });
    if (res.error) { console.error(res.error); $('list').replaceChildren(el('div', { class: 'empty', text: 'Could not load bookings: ' + res.error.message })); return; }
    bookings = res.data || [];
    render();
  }

  async function save(id, patch, savedEl) {
    var res = await client.from('bookings').update(patch).eq('id', id).select();
    if (res.error || !res.data || !res.data.length) {
      alertBox(savedEl, 'Not saved — check you are logged in as the admin', true);
      return false;
    }
    var b = bookings.find(function (x) { return x.id === id; });
    if (b) Object.assign(b, res.data[0]);
    alertBox(savedEl, 'Saved', false);
    return true;
  }
  function alertBox(node, text, bad) {
    node.textContent = text; node.style.color = bad ? 'var(--error)' : 'var(--done)';
    clearTimeout(node._t); node._t = setTimeout(function () { node.textContent = ''; }, 2500);
  }

  function renderStats() {
    var pending = 0, done = 0, earned = 0, todayCount = 0;
    bookings.forEach(function (b) {
      if (b.status === 'pending') pending++;
      if (b.status === 'done') { done++; earned += Number(b.price) || 0; }
      if (b.preferred_date === today && b.status !== 'cancelled') todayCount++;
    });
    $('s-pending').textContent = pending;
    $('s-today').textContent = todayCount;
    $('s-done').textContent = done;
    $('s-earned').textContent = 'AED ' + earned.toLocaleString('en-GB');
  }

  function card(b) {
    var saved = el('div', { class: 'saved', 'aria-live': 'polite' });

    var head = el('div', { class: 'c-head' }, [
      el('span', { class: 'c-name', text: b.name }),
      el('span', { class: 'badge ' + b.status, text: b.status }),
      el('span', { class: 'c-when', text: fmtDate(b.preferred_date) + ' · ' + (TIMES[b.preferred_time] || b.preferred_time) })
    ]);
    var meta = el('div', { class: 'c-meta' }, [
      el('span', null, [el('b', { text: SERVICES[b.service] || b.service })]),
      el('span', { text: b.area }),
      b.car ? el('span', { text: b.car }) : null,
      el('span', { text: 'Booked ' + new Date(b.created_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) })
    ]);
    var wa = waNumber(b.phone);
    var contact = el('div', { class: 'c-contact' }, [
      el('a', { href: 'tel:' + b.phone.replace(/[^\d+]/g, ''), text: 'Call ' + b.phone }),
      el('a', { href: 'https://wa.me/' + wa, target: '_blank', rel: 'noopener', text: 'WhatsApp' }),
      el('a', { href: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.area + ', Dubai'), target: '_blank', rel: 'noopener', text: 'Map' })
    ]);
    var main = el('div', null, [head, meta, contact]);

    // Status
    var sid = 'st-' + b.id, pid = 'pr-' + b.id, jid = 'jb-' + b.id;
    var status = el('select', { id: sid });
    ['pending', 'done', 'cancelled'].forEach(function (s) {
      var o = el('option', { value: s, text: s.charAt(0).toUpperCase() + s.slice(1) });
      if (b.status === s) o.selected = true;
      status.appendChild(o);
    });
    status.addEventListener('change', async function () {
      if (await save(b.id, { status: status.value }, saved)) { renderStats(); setTimeout(render, 700); }
    });

    // Job type
    var job = el('select', { id: jid });
    Object.keys(SERVICES).forEach(function (s) {
      var o = el('option', { value: s, text: SERVICES[s] });
      if (b.service === s) o.selected = true;
      job.appendChild(o);
    });
    job.addEventListener('change', function () { save(b.id, { service: job.value }, saved).then(render); });

    // Price
    var price = el('input', { id: pid, type: 'number', min: '0', step: '1', inputmode: 'decimal', value: String(b.price == null ? '' : Number(b.price)) });
    price.addEventListener('change', async function () {
      var v = price.value === '' ? null : Number(price.value);
      if (await save(b.id, { price: v }, saved)) renderStats();
    });

    var side = el('div', { class: 'c-side' }, [
      el('div', null, [el('label', { for: sid, text: 'Status' }), status]),
      el('div', null, [el('label', { for: jid, text: 'Job' }), job]),
      el('div', null, [el('label', { for: pid, text: 'Price (AED)' }), el('div', { class: 'price-row' }, [price])]),
      saved
    ]);

    var looking = b.looking_for ? el('div', { class: 'looking' }, [
      el('b', { text: 'Looking for in particular' }), el('p', { text: b.looking_for })
    ]) : null;

    var nid = 'nt-' + b.id;
    var notes = el('textarea', { id: nid, rows: '1', placeholder: 'Your private notes (only you see these)…', 'aria-label': 'Private notes' });
    notes.value = b.admin_notes || '';
    notes.addEventListener('change', function () { save(b.id, { admin_notes: notes.value.trim() || null }, saved); });

    return el('article', { class: 'card' + (b.status === 'done' ? ' is-done' : '') }, [main, side, looking, el('div', { class: 'notes' }, [notes])]);
  }

  function render() {
    renderStats();
    var q = $('search').value.trim().toLowerCase();
    var rows = bookings.filter(function (b) {
      if (filter !== 'all' && b.status !== filter) return false;
      if (!q) return true;
      return [b.name, b.phone, b.area, b.car, b.looking_for].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    if (filter === 'done' || filter === 'cancelled') rows.reverse(); // newest first
    var list = $('list');
    if (!rows.length) {
      list.replaceChildren(el('div', { class: 'empty', text: filter === 'pending' && !q ? 'No pending bookings right now.' : 'No bookings match.' }));
      return;
    }
    list.replaceChildren.apply(list, rows.map(card));
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      filter = t.dataset.filter;
      document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-pressed', String(x === t)); });
      render();
    });
  });
  $('search').addEventListener('input', render);
  $('refresh').addEventListener('click', load);

  $('login').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!client) { $('login-err').textContent = 'Supabase is not set up yet — fill in config.js.'; return; }
    $('login-btn').disabled = true; $('login-err').textContent = '';
    if (!cfg.ADMIN_EMAIL || cfg.ADMIN_EMAIL.indexOf('YOUR') !== -1) { $('login-btn').disabled = false; $('login-err').textContent = 'Add your admin email to config.js first.'; return; }
    var res = await client.auth.signInWithPassword({ email: cfg.ADMIN_EMAIL, password: $('password').value });
    $('login-btn').disabled = false;
    if (res.error) { $('login-err').textContent = 'Wrong password.'; $('password').select(); return; }
    $('password').value = '';
    showDash(); load();
  });
  $('logout').addEventListener('click', async function () { await client.auth.signOut(); bookings = []; showLogin(); });

  (async function start() {
    if (!client) { showLogin('Supabase is not set up yet — fill in config.js.'); return; }
    var s = await client.auth.getSession();
    if (s.data && s.data.session) { showDash(); load(); } else showLogin();
    // Auto-refresh every minute while open
    setInterval(function () { if (!$('dash').classList.contains('hidden') && document.visibilityState === 'visible') load(); }, 60000);
  })();
})();
</script>
</body>
</html>
